# Overwatch - Multi-Tenant Management Tool
# This compose file runs Overwatch itself (not the tenants it manages)

services:
  overwatch:
    build: .
    container_name: overwatch
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    ports:
      # Local-only direct access. Production should route through Traefik.
      - "127.0.0.1:3002:3002"
    environment:
      PORT: 3002
      # Trust one upstream hop (Traefik). On multi-tenant Docker networks
      # set this to a specific proxy IP/subnet to prevent X-Forwarded-For spoofing.
      OVERWATCH_TRUST_PROXY: "${OVERWATCH_TRUST_PROXY:-1}"
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Database root credentials (for tenant database management)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      # Registry credentials
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      DOCKER_USERNAME: ${DOCKER_USERNAME:-}
      DOCKER_PASSWORD: ${DOCKER_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-}
      # Backup credentials
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
    volumes:
      # Mount Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount configuration file
      - ./overwatch.yaml:/app/overwatch.yaml:ro
      # Mount runtime state as directories so Docker doesn't auto-create
      # missing file bind targets as directories.
      - ./data:/app/data
      # Path matches networking.apps_path in the sample overwatch.yaml.
      - ./apps:/app/apps
    networks:
      - default
      # Connect to your project's network for database/container access
      # - your-project-network

networks:
  default:
    name: overwatch-network

# To connect Overwatch to your project's existing network:
# 1. Uncomment the network in the service and at the bottom
# 2. Replace 'your-project-network' with your actual network name
# Example:
#   networks:
#     - myapp-network
#   ...
#   myapp-network:
#     external: true
