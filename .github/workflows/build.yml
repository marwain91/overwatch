name: Release
run-name: Release ${{ inputs.tag || github.ref_name }}

# Tags are immutable, so a release build lost to an outage cannot be recovered
# by re-pushing its tag. `workflow_dispatch` rebuilds any existing tag without
# re-cutting it: the checkout, image tags, and release upload all follow the
# `tag` input rather than the dispatched ref.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, e.g. v1.7.1'
        required: true
        type: string
      mark_latest:
        description: 'Also move the :latest image tag to this build (leave off when rebuilding an older release)'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Build-provenance attestation: OIDC token for the Sigstore signing
      # certificate, and the right to store the attestation.
      id-token: write
      attestations: write

    steps:
      # Reject anything that isn't a vX.Y.Z tag before it reaches `ref:`.
      # Passed via env rather than interpolated into the script.
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Derive the version from the tag being built. On a manual rebuild the
          # dispatched ref is usually a branch, so semver must read the input
          # instead of the ref. `latest` only moves on a real tag push unless the
          # operator opts in — rebuilding an old release must not demote latest.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.mark_latest }}

      - name: Resolve build metadata
        id: build_time
        # github.sha is the dispatched ref's commit, not the tag we checked out.
        run: |
          echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_TIME=${{ steps.build_time.outputs.value }}
            BUILD_COMMIT=${{ steps.build_time.outputs.sha }}

      # Signed SLSA provenance for the pushed image (by digest), stored with the
      # repository's attestations and in the registry next to the image.
      # Verify with `gh attestation verify oci://ghcr.io/<repo>:<version> --repo <repo>`.
      - name: Attest image build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records exist only for organization-owned repositories.
          create-storage-record: false

  cli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Validate tag input
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$TAG' is not a vX.Y.Z release tag"; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Build CLI binaries
        run: |
          npx @yao-pkg/pkg dist/cli.js --target node24-linux-x64 --output dist/bin/overwatch-linux-x64 --compress GZip
          npx @yao-pkg/pkg dist/cli.js --target node24-linux-arm64 --output dist/bin/overwatch-linux-arm64 --compress GZip

      - name: Generate SHA256 checksums
        run: |
          cd dist/bin
          sha256sum overwatch-linux-x64 > overwatch-linux-x64.sha256
          sha256sum overwatch-linux-arm64 > overwatch-linux-arm64.sha256

      # Signed SLSA provenance for both binaries, before they are published.
      # Verify with `gh attestation verify overwatch-linux-x64 --repo <repo>`.
      - name: Attest CLI binary build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/bin/overwatch-linux-x64
            dist/bin/overwatch-linux-arm64

      - name: Upload binaries to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # On dispatch the ref is a branch, so name the release explicitly.
          # No `body:` — an existing release keeps its notes; a release created
          # by a rebuild starts empty and needs `gh release edit --notes-file`.
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/bin/overwatch-linux-x64
            dist/bin/overwatch-linux-x64.sha256
            dist/bin/overwatch-linux-arm64
            dist/bin/overwatch-linux-arm64.sha256
