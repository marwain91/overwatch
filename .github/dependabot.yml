version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Types must describe the deployed Node 26 LTS runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
    schedule:
      interval: weekly
      day: monday

  # The Dockerfile pins node:24-alpine by digest (tag@sha256:...); this bumps
  # the digest of all three FROM lines whenever the tag is rebuilt.
  # The generated infrastructure templates (traefik:v3.7.19, mariadb:10.11,
  # postgres:16) are not digest-pinned on purpose: their minor-line tags keep
  # delivering security patches to hosts whenever the images are pulled.
  - package-ecosystem: docker
    directory: "/"
    # Runtime major upgrades require a coordinated Docker/CLI migration.
    # Continue receiving all security digest updates within Node 26 LTS.
    ignore:
      - dependency-name: "node"
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
