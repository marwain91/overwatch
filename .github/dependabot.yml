version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday

  # The Dockerfile pins node:24-alpine by digest (tag@sha256:...); this bumps
  # the digest of all three FROM lines whenever the tag is rebuilt.
  # The generated infrastructure templates (traefik:v3.7.19, mariadb:10.11,
  # postgres:16) are not digest-pinned on purpose: their minor-line tags keep
  # delivering security patches to hosts whenever the images are pulled.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
