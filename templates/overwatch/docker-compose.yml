# Overwatch container deployment. Managed by `overwatch infra deploy`.
# Secrets come from ../.env. overwatch.yaml holds project configuration.

services:
  overwatch:
    image: ghcr.io/marwain91/overwatch:latest
    container_name: ${PROJECT_PREFIX}-overwatch
    restart: unless-stopped
    environment:
      OVERWATCH_UID: "${OVERWATCH_UID:-1001}"
      OVERWATCH_GID: "${OVERWATCH_GID:-1001}"
      PORT: 3002
      OVERWATCH_TRUST_PROXY: "${OVERWATCH_TRUST_PROXY:-1}"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      GHCR_TOKEN: ${GHCR_TOKEN}
      AUTH_SERVICE_SECRET: ${AUTH_SERVICE_SECRET}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT:-https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker:/root/.docker:ro
      # Mounted RW so the admin UI / REST API can persist edits (Traefik
      # config, etc.). Host file permissions still gate writes.
      - ./overwatch.yaml:/app/overwatch.yaml
      - ./data:/app/data
      - ${APPS_PATH_ON_HOST}:/app/apps
    networks:
      - shared
    labels:
      # The admin UI usually lives on the SERVER's hostname (e.g.
      # admin.my-host.example.com), not on a tenant-app domain — so it needs
      # its own host + cert-resolver pair distinct from BASE_DOMAIN / wildcard
      # certs. Set OVERWATCH_ADMIN_HOST in overwatch/.env to the FQDN users
      # reach the admin UI at, and OVERWATCH_ADMIN_CERT_RESOLVER to a resolver
      # Traefik can satisfy for that host (defaults to "letsencrypt" = HTTP
      # challenge, which works for any publicly-reachable domain).
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`${OVERWATCH_ADMIN_HOST}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=${OVERWATCH_ADMIN_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.admin.loadbalancer.server.port=3002"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

networks:
  shared:
    name: ${NETWORK_NAME}
    external: true
