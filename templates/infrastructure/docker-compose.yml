# Shared infrastructure stack managed by `overwatch infra deploy`.
# Traefik reverse proxy + shared MariaDB. One stack per Overwatch host.
#
# Do not edit this file directly — it is regenerated from the Overwatch
# template on every `overwatch infra deploy` run. Operator-specific values
# come from ../.env and from overwatch.yaml.

services:
  traefik:
    image: traefik:v3.6
    container_name: ${PROJECT_PREFIX}-traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN}
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_CF_ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-letsencrypt:/letsencrypt
      - traefik-logs:/var/log/traefik
    networks:
      - shared

  mariadb:
    image: mariadb:10.11
    container_name: ${PROJECT_PREFIX}-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - shared
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shared:
    name: ${NETWORK_NAME}
    driver: bridge

volumes:
  traefik-letsencrypt:
  traefik-logs:
  mariadb-data:
